[project]
name = "signal-scout"
version = "0.1.0"
description = "Pluggable Telegram alert bot that scans public data sources, filters, dedups, and notifies."
authors = [{ name = "Jonathan Parker" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["requests>=2.31", "PyYAML>=6.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.6"]

[project.scripts]
signal-scout = "signal_scout.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["signal_scout*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
